<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PBP Background — Parcel Grid Landscape</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(to right, #033349 0%, #014A65 35%, #015270 65%, #0b7a48 100%);
  position: relative;
}
body::before {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(to right, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 44px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 44px);
  background-size: 44px 44px;
}
.parcels {
  position: absolute;
  top: 80px; left: 80px; right: 80px; bottom: 80px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 6px;
}
.p {
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
}
.p.on { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.02); }
.p.hl { border-color: #41BE48; background: rgba(65,190,72,0.07); }
.p .id {
  position: absolute; top: 8px; left: 10px;
  font-family: 'Lato', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; color: rgba(255,255,255,0.15);
}
.p.on .id { color: rgba(255,255,255,0.28); }
.p.hl .id { color: rgba(65,190,72,0.6); }
/* Corner ticks */
.tk { position: absolute; }
.tk::before, .tk::after { content: ""; position: absolute; background: rgba(255,255,255,0.18); }
.tl { top: 32px; left: 32px; }
.tl::before { width: 32px; height: 1px; }
.tl::after { width: 1px; height: 32px; }
.tr { top: 32px; right: 32px; }
.tr::before { width: 32px; height: 1px; right: 0; }
.tr::after { width: 1px; height: 32px; right: 0; }
.bl { bottom: 32px; left: 32px; }
.bl::before { width: 32px; height: 1px; bottom: 0; }
.bl::after { width: 1px; height: 32px; bottom: 0; }
.br { bottom: 32px; right: 32px; }
.br::before { width: 32px; height: 1px; right: 0; bottom: 0; }
.br::after { width: 1px; height: 32px; right: 0; bottom: 0; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div class="parcels">
  <div class="p on"><span class="id">T-101</span></div>
  <div class="p"><span class="id">T-102</span></div>
  <div class="p hl"><span class="id">T-103</span></div>
  <div class="p"><span class="id">T-104</span></div>
  <div class="p on"><span class="id">T-105</span></div>
  <div class="p"><span class="id">T-106</span></div>
  <div class="p"><span class="id">T-107</span></div>
  <div class="p on"><span class="id">T-108</span></div>
  <div class="p"><span class="id">T-109</span></div>
  <div class="p on"><span class="id">T-110</span></div>
  <div class="p"><span class="id">T-111</span></div>
  <div class="p"><span class="id">T-112</span></div>
  <div class="p hl"><span class="id">T-113</span></div>
  <div class="p"><span class="id">T-114</span></div>
  <div class="p"><span class="id">T-115</span></div>
  <div class="p on"><span class="id">T-116</span></div>
  <div class="p"><span class="id">T-117</span></div>
  <div class="p"><span class="id">T-118</span></div>
  <div class="p"><span class="id">T-119</span></div>
  <div class="p on"><span class="id">T-120</span></div>
  <div class="p"><span class="id">T-121</span></div>
  <div class="p hl"><span class="id">T-122</span></div>
  <div class="p"><span class="id">T-123</span></div>
  <div class="p"><span class="id">T-124</span></div>
  <div class="p on"><span class="id">T-125</span></div>
  <div class="p"><span class="id">T-126</span></div>
  <div class="p"><span class="id">T-127</span></div>
  <div class="p"><span class="id">T-128</span></div>
  <div class="p on"><span class="id">T-129</span></div>
  <div class="p"><span class="id">T-130</span></div>
  <div class="p"><span class="id">T-131</span></div>
  <div class="p hl"><span class="id">T-132</span></div>
</div>
<div class="tk tl"></div><div class="tk tr"></div>
<div class="tk bl"></div><div class="tk br"></div>
</body>
</html>
