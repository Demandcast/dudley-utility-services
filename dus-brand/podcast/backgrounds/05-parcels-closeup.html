<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PBP Background — Parcel Close-Up</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(160deg, #033349 0%, #015270 50%, #0b7a48 100%);
  position: relative;
}
body::before {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(to right, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 44px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 44px);
  background-size: 44px 44px;
}
/* Large-scale parcel grid — zoomed in, bleeds off edges */
.parcels {
  position: absolute;
  top: -60px; left: -40px; right: -40px; bottom: -60px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
}
.p {
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
}
.p.on { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.015); }
.p.hl { border-color: rgba(65,190,72,0.5); background: rgba(65,190,72,0.05); }
.p .id {
  position: absolute; top: 12px; left: 14px;
  font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700;
  letter-spacing: 0.1em; color: rgba(255,255,255,0.10);
}
.p.on .id { color: rgba(255,255,255,0.20); }
.p.hl .id { color: rgba(65,190,72,0.35); }
/* Route alignment line — diagonal */
.route {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 2;
}
.route-line {
  position: absolute;
  top: 20%; left: 10%;
  width: 85%;
  height: 2px;
  background: rgba(65,190,72,0.12);
  transform: rotate(-8deg);
  transform-origin: left center;
}
.route-line::after {
  content: "";
  position: absolute;
  top: -6px; right: 0;
  width: 0; height: 0;
  border-left: 8px solid rgba(65,190,72,0.12);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div class="parcels">
  <div class="p on"><span class="id">T-201</span></div>
  <div class="p hl"><span class="id">T-202</span></div>
  <div class="p hl"><span class="id">T-203</span></div>
  <div class="p on"><span class="id">T-204</span></div>
  <div class="p"><span class="id">T-205</span></div>
  <div class="p hl"><span class="id">T-206</span></div>
  <div class="p on"><span class="id">T-207</span></div>
  <div class="p"><span class="id">T-208</span></div>
  <div class="p"><span class="id">T-209</span></div>
  <div class="p on"><span class="id">T-210</span></div>
  <div class="p"><span class="id">T-211</span></div>
  <div class="p"><span class="id">T-212</span></div>
  <div class="p on"><span class="id">T-213</span></div>
  <div class="p hl"><span class="id">T-214</span></div>
  <div class="p"><span class="id">T-215</span></div>
</div>
<div class="route"><div class="route-line"></div></div>
</body>
</html>
