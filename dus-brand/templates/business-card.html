<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUS Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       DUS Business Card Template — Option C "Split Panel"
       Canvas: 1050 x 600 px  (3.5 in x 2 in at 300 DPI)

       EXPORT (PNG for Vistaprint):
       For each side, open this file with #only-1 (front)
       or #only-2 (back) appended to the URL, then run:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless \
         --screenshot=front.png \
         --window-size=1050,600 \
         --force-device-scale-factor=3 \
         --hide-scrollbars \
         --disable-gpu \
         "file:///path/to/business-card.html#only-1"

       This produces a 3150x1800 PNG (900 DPI equivalent).
       The #only-N flag flattens the card by cloning the
       target canvas into an empty body, so nothing shifts.

       Repeat with #only-2 for the back.
       ═══════════════════════════════════════════════════════ */

    :root {
      --teal-900: #012A39;
      --teal-700: #015270;
      --teal-500: #015270;
      --green-500: #41BE48;
      --neutral-900: #1A1A1A;
      --neutral-800: #2D2D2D;
      --neutral-700: #404040;
      --ink-800: #2B2B2B;
      --ink-600: #6E6E6E;
      --white: #FFFFFF;
      --card-w: 1050px;
      --card-h: 600px;
      --field-teal: linear-gradient(142deg, #026687 0%, #015270 34%, #033349 66%, #071C26 100%);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: #d5d5d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 48px;
      -webkit-font-smoothing: antialiased;
      color: var(--ink-800);
    }

    .side-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .side-label {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--neutral-700);
    }

    .canvas {
      width: var(--card-w);
      height: var(--card-h);
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.14);
    }

    /* ═══ FRONT — Split Panel ═══ */
    .front { background: var(--white); display: flex; }

    .front-teal {
      width: 38%; height: 100%;
      background: var(--field-teal);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 28px; position: relative;
    }

    .front-teal-logo { height: 100px; width: auto; object-fit: contain; display: block; }

    .front-white {
      width: 62%; height: 100%;
      padding: 44px 48px;
      display: flex; flex-direction: column; justify-content: center;
    }

    .front-name {
      font-weight: 900; font-size: 52px; color: var(--neutral-900);
      line-height: 1.1; letter-spacing: -0.01em;
    }

    .front-title {
      font-weight: 700; font-size: 22px; color: var(--ink-600);
      text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px;
    }

    .front-divider {
      width: 56px; height: 3px; background: var(--green-500);
      margin: 24px 0;
    }

    .front-contact { display: flex; flex-direction: column; gap: 14px; }
    .contact-item { display: flex; align-items: center; gap: 14px; }
    .contact-icon { width: 26px; height: 26px; flex-shrink: 0; color: var(--teal-700); }
    .contact-text {
      font-weight: 700; font-size: 22px; color: var(--neutral-900); letter-spacing: 0.01em;
    }

    /* ═══ BACK ═══ */
    .back {
      background: linear-gradient(90deg, var(--teal-700) 0%, var(--green-500) 100%);
    }

    .back-inner {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 24px;
    }

    .back-logo { height: 170px; width: auto; object-fit: contain; display: block; margin-bottom: 16px; }

    .back-services {
      font-weight: 900; font-size: 18px; color: var(--white);
      text-transform: uppercase; letter-spacing: 0.14em;
    }

    /* ═══ Print ═══ */
    @media print {
      body { background: none; padding: 0; gap: 0; }
      .side-label { display: none; }
      .canvas { box-shadow: none; border-radius: 0; page-break-after: always; }
    }
  </style>
</head>

  <script>
    // ═══ Flatten-and-isolate for PNG export ═══
    // Append #only-1 (front) or #only-2 (back) to the URL.
    // The script clones the target canvas into an empty body
    // so nothing shifts between the browser preview and the
    // headless Chrome screenshot.
    (function () {
      var m = location.hash.match(/^#only-(\d+)$/);
      if (!m) return;
      var n = parseInt(m[1], 10);
      var wrappers = document.querySelectorAll('.side-wrapper');
      if (n < 1 || n > wrappers.length) return;
      var target = wrappers[n - 1].querySelector('.canvas');
      if (!target) return;
      var clone = target.cloneNode(true);
      document.body.innerHTML = '';
      clone.style.position = 'fixed';
      clone.style.top = '0';
      clone.style.left = '0';
      clone.style.width = '1050px';
      clone.style.height = '600px';
      clone.style.borderRadius = '0';
      clone.style.boxShadow = 'none';
      clone.style.display = 'flex';
      document.body.style.margin = '0';
      document.body.style.padding = '0';
      document.body.style.background = 'white';
      document.body.style.overflow = 'hidden';
      document.body.appendChild(clone);
    })();
  </script>
